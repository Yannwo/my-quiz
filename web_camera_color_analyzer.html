<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網頁版相機顏色分析器</title>
    <!-- 引入 Tailwind CSS 進行現代化 UI 設計 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 FontAwesome 圖標 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入 Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* 自訂動畫與鏡像反轉 */
        .mirror-mode {
            transform: scaleX(-1);
        }
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse-slow {
            animation: pulse-slow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 sm:p-6">

    <header class="w-full max-w-md mx-auto text-center py-2 mb-2">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-900 border border-slate-800 text-xs font-medium text-emerald-400 mb-2 shadow-inner">
            <i class="fa-solid fa-circle-dot animate-pulse"></i> 視訊鏡頭顏色辨識中
        </div>
        <h1 class="text-2xl font-bold tracking-tight bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400 bg-clip-text text-transparent">
            智慧顏色分析器
        </h1>
        <p class="text-xs text-slate-400 mt-1">將欲辨識的物件置於中央方框內進行分析</p>
    </header>

    <main class="w-full max-w-md mx-auto flex flex-col items-center flex-grow justify-center gap-4">
        
        <!-- 相機觀景窗容器 -->
        <div class="relative w-full aspect-[3/4] max-h-[50vh] bg-slate-900 rounded-3xl overflow-hidden shadow-2xl border border-slate-800 flex items-center justify-center">
            
            <!-- 視訊串流畫面 -->
            <video id="video" autoplay playsinline muted class="w-full h-full object-cover mirror-mode"></video>
            
            <!-- 隱藏的 Canvas 用於擷取畫面像素 -->
            <canvas id="canvas" class="hidden"></canvas>

            <!-- 中央對焦取樣框 -->
            <div class="absolute inset-0 pointer-events-none flex items-center justify-center">
                <div class="relative w-36 h-36 border-2 border-dashed border-emerald-400/80 rounded-2xl flex items-center justify-center shadow-[0_0_20px_rgba(16,185,129,0.2)] bg-emerald-500/5 backdrop-blur-[2px]">
                    <div class="w-2 h-2 bg-emerald-400 rounded-full animate-ping"></div>
                    <!-- 四角落裝飾 -->
                    <div class="absolute -top-1 -left-1 w-3 h-3 border-t-2 border-l-2 border-emerald-400"></div>
                    <div class="absolute -top-1 -right-1 w-3 h-3 border-t-2 border-r-2 border-emerald-400"></div>
                    <div class="absolute -bottom-1 -left-1 w-3 h-3 border-b-2 border-l-2 border-emerald-400"></div>
                    <div class="absolute -bottom-1 -right-1 w-3 h-3 border-b-2 border-r-2 border-emerald-400"></div>
                </div>
            </div>

            <!-- 相機控制捷徑浮動按鈕 (切換鏡頭 / 閃光燈模擬等) -->
            <div class="absolute top-4 right-4 flex gap-2">
                <button id="switchCameraBtn" title="切換前後鏡頭" class="w-10 h-10 rounded-full bg-slate-900/80 backdrop-blur-md border border-slate-700/60 flex items-center justify-center text-slate-200 hover:bg-slate-800 transition shadow-lg active:scale-95">
                    <i class="fa-solid fa-camera-rotate text-sm"></i>
                </button>
            </div>

            <!-- 相機未開啟時的提示層 -->
            <div id="cameraPlaceholder" class="absolute inset-0 bg-slate-900 flex flex-col items-center justify-center gap-3 p-6 text-center z-10">
                <div class="w-16 h-16 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 text-2xl shadow-inner">
                    <i class="fa-solid fa-video"></i>
                </div>
                <div>
                    <h3 class="font-semibold text-slate-200">準備啟用相機</h3>
                    <p class="text-xs text-slate-400 mt-1">請點擊下方按鈕允許瀏覽器存取相機權限</p>
                </div>
                <button id="startCameraBtn" class="mt-2 px-5 py-2.5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-semibold text-sm shadow-lg shadow-emerald-500/20 transition active:scale-95 flex items-center gap-2">
                    <i class="fa-solid fa-power-off"></i> 開啟相機
                </button>
            </div>
        </div>

        <!-- 拍攝與分析控制按鈕 -->
        <div class="w-full flex items-center justify-center gap-3">
            <button id="captureBtn" disabled class="flex-1 py-3.5 px-6 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 disabled:opacity-40 disabled:cursor-not-allowed text-slate-950 font-bold text-base shadow-xl shadow-emerald-500/20 transition active:scale-95 flex items-center justify-center gap-2">
                <i class="fa-solid fa-camera"></i> 拍攝並分析顏色
            </button>
            <button id="toggleFreezeBtn" disabled title="暫停/繼續畫面" class="w-12 h-12 rounded-2xl bg-slate-900 border border-slate-800 hover:bg-slate-800 disabled:opacity-40 disabled:cursor-not-allowed text-slate-300 flex items-center justify-center transition active:scale-95 shadow-md">
                <i class="fa-solid fa-pause text-sm" id="freezeIcon"></i>
            </button>
        </div>

        <div id="resultCard" class="w-full bg-slate-900/90 backdrop-blur-xl border border-slate-800/80 rounded-3xl p-4 shadow-xl transition-all duration-300">
            <div class="flex items-center justify-between mb-3">
                <span class="text-xs font-semibold tracking-wider text-slate-400 uppercase">分析結果</span>
                <span id="timestamp" class="text-[10px] text-slate-500">尚未檢測</span>
            </div>

            <div class="flex items-center gap-4">
                <!-- 色塊預覽 -->
                <div id="colorPreviewBox" class="w-16 h-16 rounded-2xl bg-slate-800 border-2 border-slate-700/60 shadow-inner flex-shrink-0 flex items-center justify-center transition-colors duration-300">
                    <i class="fa-solid fa-palette text-slate-600 text-xl" id="paletteIcon"></i>
                </div>

                <!-- 顏色名稱與細節 -->
                <div class="flex-grow">
                    <div id="colorName" class="text-xl font-bold text-slate-100 tracking-tight">等待檢測中...</div>
                    <div class="flex items-center gap-3 mt-1.5 text-xs text-slate-400 font-mono">
                        <span id="rgbValue" class="bg-slate-950/60 px-2 py-1 rounded-lg border border-slate-800">RGB: (---, ---, ---)</span>
                        <span id="hexValue" class="bg-slate-950/60 px-2 py-1 rounded-lg border border-slate-800">HEX: #------</span>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <footer class="w-full max-w-md mx-auto text-center pt-2 text-[11px] text-slate-500">
        Web Camera Color Analyzer &bull; HTML5 & Tailwind CSS
    </footer>

    <!-- 自訂提示訊息框 (替代 alert) -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 border border-slate-700 text-slate-200 px-4 py-2.5 rounded-2xl shadow-2xl text-xs flex items-center gap-2 opacity-0 pointer-events-none transition-all duration-300 z-50">
        <i class="fa-solid fa-circle-info text-emerald-400"></i>
        <span id="toastMessage">提示訊息</span>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const startCameraBtn = document.getElementById('startCameraBtn');
        const captureBtn = document.getElementById('captureBtn');
        const toggleFreezeBtn = document.getElementById('toggleFreezeBtn');
        const freezeIcon = document.getElementById('freezeIcon');
        const switchCameraBtn = document.getElementById('switchCameraBtn');
        const cameraPlaceholder = document.getElementById('cameraPlaceholder');
        
        const colorPreviewBox = document.getElementById('colorPreviewBox');
        const paletteIcon = document.getElementById('paletteIcon');
        const colorNameEl = document.getElementById('colorName');
        const rgbValueEl = document.getElementById('rgbValue');
        const hexValueEl = document.getElementById('hexValue');
        const timestampEl = document.getElementById('timestamp');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');

        let stream = null;
        let useFrontCamera = true;
        let isFrozen = false;

        // 顯示提示訊息函式 (取代 alert)
        function showToast(message) {
            toastMessage.textContent = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }

        // 啟動相機
        async function startCamera() {
            try {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }

                const constraints = {
                    video: {
                        facingMode: useFrontCamera ? 'user' : 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                };

                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                // 隱藏預設佔位提示
                cameraPlaceholder.classList.add('hidden');
                captureBtn.disabled = false;
                toggleFreezeBtn.disabled = false;
                
                showToast('相機已成功啟動');
            } catch (err) {
                console.error('無法啟動相機:', err);
                showToast('無法存取相機，請檢查瀏覽器權限設定');
            }
        }

        // 轉換 RGB 為 HEX
        function rgbToHex(r, g, b) {
            return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
        }

        // 智慧色彩辨識邏輯 (基於 RGB 區間與色調判斷)
        function identifyColor(r, g, b) {
            // 灰階與黑白判斷
            const max = Math.max(r, g, b);
            const min = Math.min(r, g, b);
            const diff = max - min;
            const avg = (r + g + b) / 3;

            if (avg > 235 && diff < 20) return "純白色";
            if (avg < 30 && diff < 20) return "純黑色";
            if (diff < 25) {
                if (avg > 180) return "亮灰色";
                if (avg < 80) return "深灰色";
                return "灰色";
            }

            // 主要色系辨識
            if (r > g && r > b) {
                if (g > 180 && r > 220) return "淺黃色";
                if (g > 120 && g < 200) return "橘色 / 黃色";
                if (b > 120 && r > 160) return "粉紅色 / 洋紅";
                if (r > 160 && g < 80 && b < 80) return "鮮紅色";
                return "紅色調";
            } else if (g > r && g > b) {
                if (r > 150 && b < 100) return "黃綠色 / 黃";
                if (b > 130) return "青色 / 青綠";
                if (g > 140) return "鮮綠色";
                return "綠色調";
            } else if (b > r && b > g) {
                if (r > 130 && g < 100) return "紫色 / 靛色";
                if (g > 150) return "水藍色 / 天藍";
                if (b > 150) return "鮮藍色";
                return "藍色調";
            }

            // 複合色與暖色/冷色細調
            if (r > 180 && g > 150 && b < 100) return "金黃色 / 棕黃";
            if (r > 120 && g < 90 && b < 80) return "棕色 / 咖啡色";

            return "綜合混合色";
        }

        // 分析畫面中央取樣框區域
        function analyzeColor() {
            if (!video.srcObject || video.paused) {
                showToast('請先確保相機正在運行');
                return;
            }

            const videoWidth = video.videoWidth;
            const videoHeight = video.videoHeight;

            if (videoWidth === 0 || videoHeight === 0) {
                showToast('等待視訊串流就緒...');
                return;
            }

            canvas.width = videoWidth;
            canvas.height = videoHeight;
            const ctx = canvas.getContext('2d');

            // 若為前鏡頭且有套用鏡像，確保抓取正確像素
            ctx.drawImage(video, 0, 0, videoWidth, videoHeight);

            // 定義取樣框在影片中的尺寸與位置 (對應畫面中央正方形 120x120 像素)
            const sampleSize = Math.floor(Math.min(videoWidth, videoHeight) * 0.25);
            const startX = Math.floor((videoWidth - sampleSize) / 2);
            const startY = Math.floor((videoHeight - sampleSize) / 2);

            try {
                const imageData = ctx.getImageData(startX, startY, sampleSize, sampleSize);
                const data = imageData.data;
                
                let totalR = 0, totalG = 0, totalB = 0;
                let pixelCount = data.length / 4;

                for (let i = 0; i < data.length; i += 4) {
                    totalR += data[i];
                    totalG += data[i + 1];
                    totalB += data[i + 2];
                }

                const avgR = Math.round(totalR / pixelCount);
                const avgG = Math.round(totalG / pixelCount);
                const avgB = Math.round(totalB / pixelCount);

                const hex = rgbToHex(avgR, avgG, avgB);
                const colorTitle = identifyClientColor(avgR, avgG, avgB);

                // 更新 UI 顯示
                colorPreviewBox.style.backgroundColor = hex;
                paletteIcon.style.display = 'none';
                colorNameEl.textContent = colorTitle;
                rgbValueEl.textContent = `RGB: (${avgR}, ${avgG}, ${avgB})`;
                hexValueEl.textContent = `HEX: ${hex}`;
                
                const now = new Date();
                timestampEl.textContent = `檢測時間: ${now.toLocaleTimeString()}`;

                showToast(`成功分析顏色：${colorTitle}`);
            } catch (e) {
                console.error(e);
                showToast('色彩分析發生錯誤');
            }
        }

        // 更精細的色彩判定輔助
        function identifyClientColor(r, g, b) {
            return identifyColor(r, g, b);
        }

        // 事件監聽綁定
        startCameraBtn.addEventListener('click', startCamera);
        
        captureBtn.addEventListener('click', () => {
            analyzeColor();
        });

        // 點擊視訊畫面也可以直接觸發分析
        video.addEventListener('click', () => {
            if (!captureBtn.disabled) {
                analyzeColor();
            }
        });

        // 切換前後鏡頭
        switchCameraBtn.addEventListener('click', () => {
            useFrontCamera = !useFrontCamera;
            
            // 如果是前鏡頭，預覽套用鏡像翻轉；後鏡頭則取消鏡像
            if (useFrontCamera) {
                video.classList.add('mirror-mode');
            } else {
                video.classList.remove('mirror-mode');
            }
            
            startCamera();
        });

        // 暫停 / 播放畫面預覽
        toggleFreezeBtn.addEventListener('click', () => {
            if (!isFrozen) {
                video.pause();
                isFrozen = true;
                freezeIcon.classList.remove('fa-pause');
                freezeIcon.classList.add('fa-play');
                showToast('畫面已暫停，您可以仔細觀察');
            } else {
                video.play();
                isFrozen = false;
                freezeIcon.classList.remove('fa-play');
                freezeIcon.classList.add('fa-pause');
                showToast('已恢復即時預覽');
            }
        });

        // 頁面載入後自動嘗試啟動相機（部分瀏覽器可能需要使用者點擊）
        window.addEventListener('load', () => {
            // 預先檢查相機支援性
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showToast('您的瀏覽器不支援相機存取功能');
            }
        });
    </script>
</body>
</html>
