<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KAWAI US-70 (900771) 現場驗琴檢查表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        /* 自訂鋼琴主題配色與字體設定 */
        :root {
            --mahogany-dark: #3B1C0E;
            --mahogany-main: #5C2C16;
            --mahogany-light: #7A3E22;
            --ivory-bg: #FAF8F5;
            --ivory-card: #FFFFFF;
            --brass-gold: #B8860B;
            --brass-light: #F3E5AB;
        }
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--ivory-bg);
            color: #2D241E;
            -webkit-tap-highlight-color: transparent;
            scroll-behavior: smooth;
        }
        .bg-mahogany {
            background: linear-gradient(135deg, #4A2210 0%, #2C1207 100%);
        }
        .text-brass {
            color: #D4AF37;
        }
        .border-brass {
            border-color: #C59B27;
        }
        /* 狀態按鈕動畫與樣式 */
        .status-btn {
            transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .status-btn:active {
            transform: scale(0.96);
        }
        /* SVG 互動熱點呼吸燈效果 */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.9; }
            50% { transform: scale(1.12); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.9; }
        }
        .hotspot-circle {
            cursor: pointer;
            transform-box: fill-box;
            transform-origin: center;
            transition: transform 0.2s ease;
        }
        .hotspot-circle:hover, .hotspot-circle:active {
            transform: scale(1.18);
        }
        /* 隱藏原生 file input */
        .hidden-input {
            display: none;
        }
    </style>
</head>
<body class="pb-32">

    <!-- 頂部固定資訊欄與即時進度 -->
    <header class="sticky top-0 z-40 bg-mahogany text-white shadow-lg border-b-2 border-brass">
        <div class="max-w-2xl mx-auto px-4 py-3">
            <div class="flex items-center justify-between gap-2">
                <div>
                    <div class="flex items-center gap-2">

                        <h1 class="text-lg sm:text-xl font-black tracking-wide text-amber-50">KAWAI US-70</h1>
                    </div>
                    <p class="text-xs text-amber-200/80 mt-0.5">序號：900771｜台日合作東和製造｜大譜架高琴身</p>
                </div>
                <button onclick="resetAllData()" class="text-xs bg-white/10 hover:bg-white/20 text-amber-100 px-2.5 py-1.5 rounded-lg border border-white/15 transition">
                    重設記錄
                </button>
            </div>

            <!-- 即時進度條 -->
            <div class="mt-3 bg-black/30 rounded-xl p-2.5 border border-white/10">

                    <span class="font-medium text-amber-100">實拍照片：<strong id="photo-count-text" class="text-emerald-300 text-sm">0</strong> 張</span>

                    <div id="progress-bar" class="bg-gradient-to-r from-amber-500 to-emerald-400 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 pt-5 space-y-6">

                    <!-- 3: 三個踏板 -->

                        <text x="220" y="347" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">3</text>
                    </g>
                    <!-- 4: 88鍵盤 -->

                <span class="inline-flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-amber-600"></span>機能測試 (3-4)</span>
                <span class="inline-flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span>細節補拍 (5-6)</span>

                class="w-full rounded-xl border border-stone-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-600 bg-stone-50"
                oninput="saveOverallNotes(this.value)"></textarea>

    <!-- 底部懸浮匯出操作列 -->

        <div class="max-w-2xl mx-auto">

    <!-- 匯出圖片預覽與下載 Modal -->
    <div id="export-modal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-5">
        <div class="bg-white rounded-2xl max-w-xl w-full max-h-[92vh] flex flex-col overflow-hidden shadow-2xl">
            <div class="px-4 py-3 bg-mahogany text-white flex items-center justify-between">
                <h3 class="font-bold text-base flex items-center gap-2">
                    <span>📋</span> 驗琴報告圖已生成
                </h3>
                <button onclick="closeExportModal()" class="p-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white text-sm">
                    ✕ 關閉
                </button>
            </div>
            
            <div class="p-3 bg-amber-50 border-b border-amber-200 text-xs text-amber-900 flex items-start gap-2">
                <span class="text-base leading-none">💡</span>
                <p>請點擊下方按鈕下載圖片，或<strong>直接長按下方圖片選擇「儲存影像」</strong>，接著回到對話框把這張報告圖傳給我，我就能幫你做最終評估！</p>
            </div>

            <div class="flex-1 overflow-y-auto p-3 bg-stone-200 flex justify-center">
                <img id="generated-report-img" src="" alt="驗琴報告圖" class="max-w-full h-auto rounded-lg shadow-md border border-stone-300 bg-white"/>
            </div>

            <div class="p-3 bg-white border-t border-stone-200 flex gap-2">
                <a id="download-report-link" href="#" download="KAWAI_US70_900771_驗琴報告.jpg"
                    class="flex-1 py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm text-center shadow flex items-center justify-center gap-1.5">
                    <span>⬇️ 下載報告圖片到手機</span>
                </a>
                <button onclick="closeExportModal()" class="py-3 px-4 rounded-xl bg-stone-200 hover:bg-stone-300 text-stone-800 font-bold text-sm">
                    返回修改
                </button>
            </div>
        </div>
    </div>

    <!-- 自訂提示訊息 Toast（取代 alert） -->
    <div id="toast-msg" class="fixed top-24 left-1/2 -translate-x-1/2 z-50 hidden bg-stone-900/90 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg transition-opacity"></div>

    <!-- 隱藏用繪圖 Canvas -->
    <canvas id="report-canvas" class="hidden"></canvas>

    <script>
        // 7 大關鍵檢查項目資料與專屬局部 SVG 圖解
        const CHECK_ITEMS = [
            {
                id: 1,
                title: "【打開下門板】響板木頭與低音粗銅弦",
                badge: "必檢致命傷",
                badgeColor: "bg-red-100 text-red-700 border-red-200",
                points: [
                    "<strong>拆開下門板：</strong>撥開鍵盤下方中央的金屬卡榫（或向上輕推），取下踏板上方那塊大木板。",
                    "<strong>手電筒照雲杉響板：</strong>確認整片木頭<strong>沒有長條狀的裂縫</strong>或受潮發黑。",
                    "<strong>檢查左側粗銅弦：</strong>銅線表面變暗屬正常，但不能有<strong>發綠嚴重生鏽或斷弦</strong>。",
                    "<strong>確認除濕棒：</strong>順便看底部有沒有安裝直立式除濕棒。"
                ],
                photoTip: "請開啟閃光燈，拍一張下門板打開後的內部響板與粗銅弦全貌",
                svg: `
                <svg viewBox="0 0 320 150" class="w-full h-36 bg-amber-50/60 rounded-xl border border-amber-200/70">
                    <!-- 鍵盤底緣 -->

        // 狀態儲存物件
        let appState = {
            items: {}, // { 1: { status: 'pass'|'warn'|'fail'|null, note: '', photos: [dataUrl1, dataUrl2] } }
            overallNotes: ''
        };

        // 初始化資料
        function initApp() {
            CHECK_ITEMS.forEach(item => {
                appState.items[item.id] = {
                    status: null,
                    note: '',
                    photos: []
                };
            });

            // 嘗試從 localStorage 讀取文字與狀態紀錄
            try {
                const saved = localStorage.getItem('kawai_us70_900771_state');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed.overallNotes) {
                        appState.overallNotes = parsed.overallNotes;
                        document.getElementById('overall-notes').value = parsed.overallNotes;
                    }
                    if (parsed.items) {
                        Object.keys(parsed.items).forEach(id => {
                            if (appState.items[id]) {
                                appState.items[id].status = parsed.items[id].status || null;
                                appState.items[id].note = parsed.items[id].note || '';
                            }
                        });
                    }
                }
            } catch (e) {
                console.warn('讀取暫存失敗:', e);
            }

            renderChecklist();
            updateProgress();
        }

        // 儲存狀態至 localStorage (不含大型 Base64 照片以免爆容量)
        function persistState() {
            try {
                const toSave = {
                    overallNotes: appState.overallNotes,
                    items: {}
                };
                Object.keys(appState.items).forEach(id => {
                    toSave.items[id] = {
                        status: appState.items[id].status,
                        note: appState.items[id].note
                    };
                });
                localStorage.setItem('kawai_us70_900771_state', JSON.stringify(toSave));
            } catch (e) {
                console.warn('暫存失敗:', e);
            }
        }

        // 渲染 7 張檢查卡片
        function renderChecklist() {
            const container = document.getElementById('checklist-container');
            container.innerHTML = CHECK_ITEMS.map(item => {
                const state = appState.items[item.id];
                const cardBorder = state.status === 'pass' ? 'border-emerald-400 ring-1 ring-emerald-400/40' :
                                   state.status === 'warn' ? 'border-amber-400 ring-1 ring-amber-400/40' :
                                   state.status === 'fail' ? 'border-red-400 ring-1 ring-red-400/40' : 'border-stone-200';

                return `
                <article id="check-card-${item.id}" class="bg-white rounded-2xl shadow-sm border ${cardBorder} overflow-hidden transition-all">
                    <!-- 卡片標題列 -->
                    <div class="px-4 py-3 bg-stone-50/90 border-b border-stone-200/80 flex items-start justify-between gap-2">
                        <div class="flex items-center gap-2.5">
                            <span class="w-7 h-7 rounded-full bg-mahogany text-amber-200 font-black text-sm flex items-center justify-center shrink-0 shadow-sm">
                                ${item.id}
                            </span>
                            <h3 class="font-bold text-stone-900 text-base leading-snug">${item.title}</h3>
                        </div>
                        <span class="text-[11px] font-bold px-2 py-0.5 rounded-full border shrink-0 ${item.badgeColor}">
                            ${item.badge}
                        </span>
                    </div>

                    <div class="p-4 space-y-3.5">
                        <!-- 專屬部位 SVG 示意圖 -->
                        <div>
                            ${item.svg}
                        </div>

                        <!-- 白話檢查要點 -->
                        <ul class="space-y-1.5 text-sm text-stone-700 bg-stone-50 rounded-xl p-3 border border-stone-200/60">
                            ${item.points.map(pt => `
                                <li class="flex items-start gap-2 leading-relaxed">
                                    <span class="text-amber-700 font-bold mt-0.5">•</span>
                                    <span>${pt}</span>
                                </li>
                            `).join('')}
                        </ul>

                        <!-- 狀態三選一按鈕 -->
                        <div>
                            <label class="block text-xs font-bold text-stone-500 mb-1.5">檢查結果勾選：</label>
                            <div class="grid grid-cols-3 gap-2">
                                <button type="button" onclick="setStatus(${item.id}, 'pass')"
                                    class="status-btn py-2.5 px-2 rounded-xl border text-xs sm:text-sm font-bold flex flex-col sm:flex-row items-center justify-center gap-1 ${state.status === 'pass' ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm' : 'bg-white text-stone-700 border-stone-300 hover:bg-emerald-50'}">
                                    <span>✅</span><span>正常通過</span>
                                </button>
                                <button type="button" onclick="setStatus(${item.id}, 'warn')"
                                    class="status-btn py-2.5 px-2 rounded-xl border text-xs sm:text-sm font-bold flex flex-col sm:flex-row items-center justify-center gap-1 ${state.status === 'warn' ? 'bg-amber-500 text-white border-amber-500 shadow-sm' : 'bg-white text-stone-700 border-stone-300 hover:bg-amber-50'}">
                                    <span>⚠️</span><span>需留意</span>
                                </button>
                                <button type="button" onclick="setStatus(${item.id}, 'fail')"
                                    class="status-btn py-2.5 px-2 rounded-xl border text-xs sm:text-sm font-bold flex flex-col sm:flex-row items-center justify-center gap-1 ${state.status === 'fail' ? 'bg-red-600 text-white border-red-600 shadow-sm' : 'bg-white text-stone-700 border-stone-300 hover:bg-red-50'}">
                                    <span>❌</span><span>有異常</span>
                                </button>
                            </div>
                        </div>

                        <!-- 現場拍照 / 上傳照片區 -->
                        <div class="bg-amber-50/50 rounded-xl p-3 border border-amber-200/70">
                            <div class="flex items-center justify-between gap-2 mb-2">
                                <span class="text-xs font-bold text-amber-900">📸 實拍記錄（最多 2 張）</span>
                                <span class="text-[11px] text-amber-700">${state.photos.length} / 2 張</span>
                            </div>
                            <p class="text-xs text-stone-600 mb-2.5">${item.photoTip}</p>

                            <!-- 照片預覽網格 -->
                            <div id="photo-grid-${item.id}" class="grid grid-cols-2 gap-2.5 mb-2.5 ${state.photos.length === 0 ? 'hidden' : ''}">
                                ${state.photos.map((src, idx) => `
                                    <div class="relative group rounded-lg overflow-hidden border border-stone-300 bg-black aspect-[4/3]">
                                        <img src="${src}" class="w-full h-full object-cover" alt="實拍照片 ${idx + 1}"/>
                                        <button type="button" onclick="removePhoto(${item.id}, ${idx})"
                                            class="absolute top-1.5 right-1.5 bg-red-600/90 hover:bg-red-700 text-white text-xs font-bold px-2 py-1 rounded-md shadow">
                                            刪除
                                        </button>
                                    </div>
                                `).join('')}
                            </div>

                            <!-- 拍照與相簿按鈕 -->
                            ${state.photos.length < 2 ? `
                                <div class="grid grid-cols-2 gap-2">
                                    <label class="cursor-pointer py-2.5 px-3 rounded-xl bg-mahogany hover:brightness-110 text-white text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm active:scale-95 transition">
                                        <span>📷 現場拍照</span>
                                        <input type="file" accept="image/*" capture="environment" class="hidden-input" onchange="handlePhotoUpload(${item.id}, this)">
                                    </label>
                                    <label class="cursor-pointer py-2.5 px-3 rounded-xl bg-white hover:bg-stone-100 text-stone-800 border border-stone-300 text-xs font-bold flex items-center justify-center gap-1.5 active:scale-95 transition">
                                        <span>🖼️ 從相簿選圖</span>
                                        <input type="file" accept="image/*" class="hidden-input" onchange="handlePhotoUpload(${item.id}, this)">
                                    </label>
                                </div>
                            ` : ''}
                        </div>

                        <!-- 現場簡短備註 -->
                        <div>
                            <input type="text" value="${escapeHtml(state.note)}"
                                placeholder="輸入此項現場備註（選填，例如：響板乾淨無裂、有附除濕棒）"
                                oninput="setNote(${item.id}, this.value)"
                                class="w-full rounded-xl border border-stone-300 px-3 py-2 text-xs sm:text-sm bg-white focus:outline-none focus:ring-2 focus:ring-amber-600"/>
                        </div>
                    </div>
                </article>
                `;
            }).join('');
        }

        // 平滑捲動到指定檢查項目
        function scrollToCheck(id) {
            const el = document.getElementById(`check-card-${id}`);
            if (el) {
                const headerOffset = 128;
                const elementPosition = el.getBoundingClientRect().top;
                const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
                window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
            }
        }

        // 設定檢查狀態
        function setStatus(id, status) {
            if (appState.items[id].status === status) {
                appState.items[id].status = null; // 再次點擊取消
            } else {
                appState.items[id].status = status;
            }
            persistState();
            renderChecklist();
            updateProgress();
        }

        // 設定備註
        function setNote(id, val) {
            appState.items[id].note = val;
            persistState();
        }

        function saveOverallNotes(val) {
            appState.overallNotes = val;
            persistState();
        }

        // 處理照片上傳與前端 Canvas 壓縮（確保清晰度同時避免記憶體溢出）
        function handlePhotoUpload(id, inputEl) {
            const file = inputEl.files && inputEl.files[0];
            if (!file) return;

            if (appState.items[id].photos.length >= 2) {
                showToast('每項最多上傳 2 張照片');
                return;
            }

            showToast('正在處理照片...');
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    // 限制最大邊長為 1000px，保留木頭紋理與琴弦細節給 AI 辨識
                    const MAX_SIZE = 1000;
                    let width = img.width;
                    let height = img.height;

                    if (width > height && width > MAX_SIZE) {
                        height = Math.round((height * MAX_SIZE) / width);
                        width = MAX_SIZE;
                    } else if (height >= width && height > MAX_SIZE) {
                        width = Math.round((width * MAX_SIZE) / height);
                        height = MAX_SIZE;
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // 轉為高品質 JPEG DataURL
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
                    appState.items[id].photos.push(compressedDataUrl);

                    // 若尚未勾選狀態，自動預設為「正常通過」方便操作（使用者可隨時更改）
                    if (!appState.items[id].status) {
                        appState.items[id].status = 'pass';
                    }

                    persistState();
                    renderChecklist();
                    updateProgress();
                    showToast('照片已加入記錄！');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // 刪除照片
        function removePhoto(id, photoIndex) {
            appState.items[id].photos.splice(photoIndex, 1);
            renderChecklist();
            updateProgress();
            showToast('已刪除照片');
        }

        // 更新頂部進度條與計數
        function updateProgress() {
            let checkedCount = 0;
            let totalPhotos = 0;
            CHECK_ITEMS.forEach(item => {
                const s = appState.items[item.id];
                if (s.status) checkedCount++;
                totalPhotos += s.photos.length;
            });

            document.getElementById('progress-text').textContent = `${checkedCount} / ${CHECK_ITEMS.length}`;
            document.getElementById('photo-count-text').textContent = totalPhotos;
            const pct = Math.round((checkedCount / CHECK_ITEMS.length) * 100);
            document.getElementById('progress-bar').style.width = `${pct}%`;
        }

        // 重設所有資料（使用自訂確認條而非 confirm()）
        let resetConfirmTimer = null;
        function resetAllData() {
            const btn = event.target;
            if (btn.dataset.confirming !== 'true') {
                btn.dataset.confirming = 'true';
                btn.textContent = '確定清除？再點一次';
                btn.classList.add('bg-red-600', 'text-white');
                resetConfirmTimer = setTimeout(() => {
                    btn.dataset.confirming = 'false';
                    btn.textContent = '重設記錄';
                    btn.classList.remove('bg-red-600', 'text-white');
                }, 3000);
                return;
            }

            clearTimeout(resetConfirmTimer);
            btn.dataset.confirming = 'false';
            btn.textContent = '重設記錄';
            btn.classList.remove('bg-red-600', 'text-white');

            localStorage.removeItem('kawai_us70_900771_state');
            appState.overallNotes = '';
            document.getElementById('overall-notes').value = '';
            CHECK_ITEMS.forEach(item => {
                appState.items[item.id] = { status: null, note: '', photos: [] };
            });
            renderChecklist();
            updateProgress();
            showToast('已重設所有檢查記錄');
        }

        // 輔助：載入 Image 物件供 Canvas 繪製
        function loadImageAsync(src) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = src;
            });
        }

        // 輔助：Canvas 自動換行文字繪製
        function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight) {
            const chars = text.split('');
            let line = '';
            let currentY = y;
            for (let i = 0; i < chars.length; i++) {
                const testLine = line + chars[i];
                const metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && i > 0) {
                    ctx.fillText(line, x, currentY);
                    line = chars[i];
                    currentY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, x, currentY);
            return currentY + lineHeight;
        }

        // 輔助：繪製圓角矩形
        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        // 核心功能：動態計算高度並繪製高解析度驗琴報告長圖 (1200px 寬)
        async function generateReportImage() {
            const btn = document.getElementById('export-btn');
            const origHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span>⏳ 正在合成高解析度報告圖...</span>';

            try {
                const W = 1200;
                const PADDING = 40;
                const CARD_W = W - PADDING * 2;

                // 預先載入所有已拍攝的照片
                const loadedPhotosMap = {};
                let passCount = 0, warnCount = 0, failCount = 0, photoTotal = 0;

                for (const item of CHECK_ITEMS) {
                    const state = appState.items[item.id];
                    if (state.status === 'pass') passCount++;
                    else if (state.status === 'warn') warnCount++;
                    else if (state.status === 'fail') failCount++;

                    loadedPhotosMap[item.id] = [];
                    for (const src of state.photos) {
                        const img = await loadImageAsync(src);
                        if (img) {
                            loadedPhotosMap[item.id].push(img);
                            photoTotal++;
                        }
                    }
                }

                // 預先計算整張長圖所需高度
                const HEADER_H = 210;
                const CARD_GAP = 24;
                const cardHeights = CHECK_ITEMS.map(item => {
                    const state = appState.items[item.id];
                    const photos = loadedPhotosMap[item.id];
                    let h = 115; // 基本標題 + 狀態高度
                    if (state.note && state.note.trim() !== '') {
                        h += 55;
                    }
                    if (photos.length > 0) {
                        h += 390; // 照片展示區高度 (寬度充足可看清木紋與細節)
                    }
                    return h;
                });

                const overallNoteH = (appState.overallNotes && appState.overallNotes.trim() !== '') ? 160 : 0;
                const FOOTER_H = 80;
                const totalH = HEADER_H + PADDING + cardHeights.reduce((a, b) => a + b + CARD_GAP, 0) + overallNoteH + FOOTER_H;

                const canvas = document.getElementById('report-canvas');
                canvas.width = W;
                canvas.height = totalH;
                const ctx = canvas.getContext('2d');

                // 1. 象牙白背景
                ctx.fillStyle = '#FAF8F5';
                ctx.fillRect(0, 0, W, totalH);

                // 2. 頂部紅木色橫幅
                const grad = ctx.createLinearGradient(0, 0, W, HEADER_H);
                grad.addColorStop(0, '#4A2210');
                grad.addColorStop(1, '#260E04');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, HEADER_H);

                // 金色底邊線
                ctx.fillStyle = '#D4AF37';
                ctx.fillRect(0, HEADER_H - 6, W, 6);

                // 標題文字
                ctx.fillStyle = '#FEF3C7';
                ctx.font = '900 42px "Noto Sans TC", sans-serif';
                ctx.fillText('KAWAI US-70（序號 900771）現場驗琴報告', PADDING, 72);

                ctx.fillStyle = '#FDE68A';
                ctx.font = '500 22px "Noto Sans TC", sans-serif';
                const nowStr = new Date().toLocaleString('zh-TW', { hour12: false });
                ctx.fillText(`台日合作東和製造｜大譜架高琴身｜產出時間：${nowStr}`, PADDING, 114);

                // 統計徽章列
                ctx.font = '700 22px "Noto Sans TC", sans-serif';
                ctx.fillStyle = '#34D399';
                ctx.fillText(`✅ 正常通過：${passCount} 項`, PADDING, 168);
                ctx.fillStyle = '#FBBF24';
                ctx.fillText(`⚠️ 需留意：${warnCount} 項`, PADDING + 250, 168);
                ctx.fillStyle = '#F87171';
                ctx.fillText(`❌ 異常：${failCount} 項`, PADDING + 480, 168);
                ctx.fillStyle = '#E7E5E4';
                ctx.fillText(`📸 實拍照片：${photoTotal} 張`, PADDING + 690, 168);

                // 3. 逐項繪製 7 張檢查結果卡片
                let curY = HEADER_H + PADDING;

                CHECK_ITEMS.forEach((item, index) => {
                    const state = appState.items[item.id];
                    const photos = loadedPhotosMap[item.id];
                    const cH = cardHeights[index];

                    // 卡片白底與外框
                    ctx.save();
                    roundRect(ctx, PADDING, curY, CARD_W, cH, 18);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fill();
                    ctx.lineWidth = 2.5;
                    ctx.strokeStyle = state.status === 'pass' ? '#16A34A' :
                                      state.status === 'warn' ? '#D97706' :
                                      state.status === 'fail' ? '#DC2626' : '#D6D3D1';
                    ctx.stroke();
                    ctx.restore();

                    // 編號圓圈
                    ctx.beginPath();
                    ctx.arc(PADDING + 42, curY + 48, 22, 0, Math.PI * 2);
                    ctx.fillStyle = '#4A2210';
                    ctx.fill();
                    ctx.fillStyle = '#FDE68A';
                    ctx.font = '900 22px "Noto Sans TC", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(String(item.id), PADDING + 42, curY + 56);
                    ctx.textAlign = 'left';

                    // 項目標題
                    ctx.fillStyle = '#1C1917';
                    ctx.font = '700 26px "Noto Sans TC", sans-serif';
                    ctx.fillText(item.title, PADDING + 78, curY + 57);

                    // 右上角狀態膠囊
                    let statusLabel = '⬜ 尚未勾選';
                    let statusBg = '#F5F5F4';
                    let statusFg = '#57534E';
                    if (state.status === 'pass') {
                        statusLabel = '✅ 正常通過';
                        statusBg = '#DCFCE7';
                        statusFg = '#15803D';
                    } else if (state.status === 'warn') {
                        statusLabel = '⚠️ 需留意';
                        statusBg = '#FEF3C7';
                        statusFg = '#B45309';
                    } else if (state.status === 'fail') {
                        statusLabel = '❌ 有異常';
                        statusBg = '#FEE2E2';
                        statusFg = '#B91C1C';
                    }

                    const badgeW = 190;
                    const badgeH = 44;
                    const badgeX = PADDING + CARD_W - badgeW - 24;
                    const badgeY = curY + 26;
                    roundRect(ctx, badgeX, badgeY, badgeW, badgeH, 22);
                    ctx.fillStyle = statusBg;
                    ctx.fill();
                    ctx.fillStyle = statusFg;
                    ctx.font = '700 22px "Noto Sans TC", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(statusLabel, badgeX + badgeW / 2, badgeY + 30);
                    ctx.textAlign = 'left';

                    let innerY = curY + 95;

                    // 若有備註文字
                    if (state.note && state.note.trim() !== '') {
                        roundRect(ctx, PADDING + 24, innerY, CARD_W - 48, 44, 10);
                        ctx.fillStyle = '#F5F5F4';
                        ctx.fill();
                        ctx.fillStyle = '#292524';
                        ctx.font = '500 21px "Noto Sans TC", sans-serif';
                        ctx.fillText(`📝 現場備註：${state.note.trim()}`, PADDING + 40, innerY + 30);
                        innerY += 60;
                    }

                    // 若有實拍照片，並排高清晰度繪製
                    if (photos.length > 0) {
                        const photoBoxW = photos.length === 1 ? 560 : (CARD_W - 68) / 2;
                        const photoBoxH = 365;

                        photos.forEach((img, pIdx) => {
                            const px = PADDING + 24 + pIdx * (photoBoxW + 20);
                            const py = innerY;

                            // 照片外框
                            roundRect(ctx, px, py, photoBoxW, photoBoxH, 12);
                            ctx.fillStyle = '#1C1917';
                            ctx.fill();

                            // 等比例置中裁切/完整容納繪製 (使用 contain 保留完整鋼琴內部細節不裁切)
                            const scale = Math.min(photoBoxW / img.width, photoBoxH / img.height);
                            const drawW = img.width * scale;
                            const drawH = img.height * scale;
                            const drawX = px + (photoBoxW - drawW) / 2;
                            const drawY = py + (photoBoxH - drawH) / 2;

                            ctx.drawImage(img, drawX, drawY, drawW, drawH);

                            // 角落照片標籤
                            ctx.fillStyle = 'rgba(0,0,0,0.65)';
                            ctx.fillRect(px + 10, py + 10, 96, 30);
                            ctx.fillStyle = '#FFFFFF';
                            ctx.font = '700 16px "Noto Sans TC", sans-serif';
                            ctx.fillText(`實拍 #${item.id}-${pIdx + 1}`, px + 18, py + 31);
                        });
                    }

                    curY += cH + CARD_GAP;
                });

                // 4. 整體補充備註欄
                if (overallNoteH > 0) {
                    roundRect(ctx, PADDING, curY, CARD_W, overallNoteH - 20, 16);
                    ctx.fillStyle = '#FEF3C7';
                    ctx.fill();
                    ctx.strokeStyle = '#F59E0B';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    ctx.fillStyle = '#78350F';
                    ctx.font = '700 24px "Noto Sans TC", sans-serif';
                    ctx.fillText('📋 買家整體補充備註：', PADDING + 28, curY + 42);

                    ctx.fillStyle = '#292524';
                    ctx.font = '500 21px "Noto Sans TC", sans-serif';
                    drawWrappedText(ctx, appState.overallNotes.trim(), PADDING + 28, curY + 80, CARD_W - 56, 30);
                    curY += overallNoteH;
                }

                // 5. 底部頁尾說明
                ctx.fillStyle = '#78716C';
                ctx.font = '500 20px "Noto Sans TC", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('KAWAI US-70 (900771) 現場驗琴檢查報告｜請將此圖傳送給 AI 進行最終琴況評估', W / 2, curY + 35);
                ctx.textAlign = 'left';

                // 轉出高品質 JPEG
                const finalDataUrl = canvas.toDataURL('image/jpeg', 0.9);
                document.getElementById('generated-report-img').src = finalDataUrl;
                document.getElementById('download-report-link').href = finalDataUrl;
                document.getElementById('export-modal').classList.remove('hidden');

            } catch (err) {
                console.error('匯出失敗:', err);
                showToast('生成圖片時發生錯誤，請減少單張照片大小後重試');
            } finally {
                btn.disabled = false;
                btn.innerHTML = origHtml;
            }
        }

        function closeExportModal() {
            document.getElementById('export-modal').classList.add('hidden');
        }

        function showToast(msg) {
            const el = document.getElementById('toast-msg');
            el.textContent = msg;
            el.classList.remove('hidden');
            clearTimeout(el._timer);
            el._timer = setTimeout(() => {
                el.classList.add('hidden');
            }, 2200);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        window.onload = initApp;
    </script>
</body>
</html>
