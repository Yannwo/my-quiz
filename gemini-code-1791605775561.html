<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tabata 定時器</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 15px;
    }
    .container {
      background-color: #1e1e1e;
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
    }
    h1 {
      margin-bottom: 15px;
      font-size: 1.5rem;
      color: #00e676;
    }
    .settings {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
      text-align: left;
    }
    .input-group {
      display: flex;
      flex-direction: column;
    }
    .input-group label {
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 4px;
    }
    .input-group input {
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 8px;
      color: #fff;
      padding: 12px 10px;
      font-size: 1.1rem;
      text-align: center;
      width: 100%;
    }
    .timer-display {
      margin: 15px 0;
      padding: 15px;
      border-radius: 15px;
      background-color: #2a2a2a;
      transition: background-color 0.3s ease;
    }
    .status {
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }
    .time {
      font-size: 3.8rem;
      font-weight: bold;
      font-family: monospace;
      line-height: 1.1;
    }
    .rounds {
      font-size: 1rem;
      color: #bbb;
      margin-top: 8px;
    }
    .controls {
      display: flex;
      gap: 12px;
    }
    button {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:active {
      transform: scale(0.98);
    }
    .btn-start {
      background-color: #00e676;
      color: #000;
    }
    .btn-pause {
      background-color: #ff9100;
      color: #000;
    }
    .btn-reset {
      background-color: #ff5252;
      color: #fff;
    }
    
    /* 狀態顏色背景 */
    .state-warmup { background-color: #311b92; }
    .state-work { background-color: #b71c1c; }
    .state-rest { background-color: #1b5e20; }
    .state-idle { background-color: #2a2a2a; }
  </style>
</head>
<body>

<div class="container">
  <h1>Tabata Timer</h1>

  <!-- 設定區 -->
  <div class="settings">
    <div class="input-group">
      <label for="warmup">暖身時間 (分鐘)</label>
      <input type="number" id="warmup" value="3" min="0" step="0.5" inputmode="decimal">
    </div>
    <div class="input-group">
      <label for="cycles">循環次數 (組)</label>
      <input type="number" id="cycles" value="8" min="1" inputmode="numeric">
    </div>
    <div class="input-group">
      <label for="work">衝刺時間 (秒)</label>
      <input type="number" id="work" value="20" min="1" inputmode="numeric">
    </div>
    <div class="input-group">
      <label for="rest">休息時間 (秒)</label>
      <input type="number" id="rest" value="10" min="0" inputmode="numeric">
    </div>
  </div>

  <!-- 計時器顯示區 -->
  <div class="timer-display state-idle" id="displayBox">
    <div class="status" id="statusText">準備</div>
    <div class="time" id="timeText">00:00</div>
    <div class="rounds" id="roundText">組數：0 / 0</div>
  </div>

  <!-- 控制按鈕 -->
  <div class="controls">
    <button class="btn-start" id="startBtn" onclick="toggleTimer()">開始</button>
    <button class="btn-reset" onclick="resetTimer()">重設</button>
  </div>
</div>

<script>
  let timer = null;
  let isRunning = false;
  
  let currentState = 'idle';
  let warmupTime = 0;
  let workTime = 0;
  let restTime = 0;
  let totalCycles = 0;
  
  let currentCycle = 1;
  let timeLeft = 0;

  const synth = window.speechSynthesis;

  function speak(text) {
    if (!synth) return;
    synth.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'zh-TW';
    utterance.rate = 1.2;
    synth.speak(utterance);
  }

  function formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
  }

  function updateDisplay() {
    document.getElementById('timeText').innerText = formatTime(timeLeft);
    const displayBox = document.getElementById('displayBox');
    const statusText = document.getElementById('statusText');
    const roundText = document.getElementById('roundText');

    displayBox.className = 'timer-display ';

    switch (currentState) {
      case 'warmup':
        statusText.innerText = '暖身中';
        displayBox.classList.add('state-warmup');
        roundText.innerText = `準備開始第 1 組`;
        break;
      case 'work':
        statusText.innerText = '衝刺中 🔥';
        displayBox.classList.add('state-work');
        roundText.innerText = `組數：${currentCycle} / ${totalCycles}`;
        break;
      case 'rest':
        statusText.innerText = '休息 ☕';
        displayBox.classList.add('state-rest');
        roundText.innerText = `組數：${currentCycle} / ${totalCycles}`;
        break;
      case 'completed':
        statusText.innerText = '完成！🎉';
        displayBox.classList.add('state-idle');
        roundText.innerText = `完成全部 ${totalCycles} 組！`;
        break;
      default:
        statusText.innerText = '準備';
        displayBox.classList.add('state-idle');
        roundText.innerText = `總共 ${totalCycles || document.getElementById('cycles').value} 組`;
    }
  }

  function toggleTimer() {
    if (isRunning) {
      pauseTimer();
    } else {
      startTimer();
    }
  }

  function startTimer() {
    const warmupMinutes = parseFloat(document.getElementById('warmup').value) || 0;
    warmupTime = Math.round(warmupMinutes * 60);
    
    workTime = parseInt(document.getElementById('work').value) || 1;
    restTime = parseInt(document.getElementById('rest').value) || 0;
    totalCycles = parseInt(document.getElementById('cycles').value) || 1;

    if (currentState === 'idle' || currentState === 'completed') {
      currentCycle = 1;
      if (warmupTime > 0) {
        currentState = 'warmup';
        timeLeft = warmupTime;
        speak('開始暖身');
      } else {
        currentState = 'work';
        timeLeft = workTime;
        speak('開始運動');
      }
    }

    isRunning = true;
    document.getElementById('startBtn').innerText = '暫停';
    document.getElementById('startBtn').className = 'btn-pause';
    disableInputs(true);

    updateDisplay();

    timer = setInterval(() => {
      tick();
    }, 1000);
  }

  function pauseTimer() {
    isRunning = false;
    clearInterval(timer);
    synth.cancel();
    document.getElementById('startBtn').innerText = '繼續';
    document.getElementById('startBtn').className = 'btn-start';
  }

  function resetTimer() {
    pauseTimer();
    currentState = 'idle';
    timeLeft = 0;
    document.getElementById('startBtn').innerText = '開始';
    document.getElementById('startBtn').className = 'btn-start';
    disableInputs(false);
    updateDisplay();
  }

  function disableInputs(disabled) {
    document.getElementById('warmup').disabled = disabled;
    document.getElementById('cycles').disabled = disabled;
    document.getElementById('work').disabled = disabled;
    document.getElementById('rest').disabled = disabled;
  }

  function tick() {
    if (timeLeft <= 10 && timeLeft >= 1) {
      speak(timeLeft.toString());
    }

    timeLeft--;

    if (timeLeft < 0) {
      switchNextState();
    } else {
      updateDisplay();
    }
  }

  function switchNextState() {
    if (currentState === 'warmup') {
      currentState = 'work';
      timeLeft = workTime;
      speak('暖身結束，開始運動');
    } else if (currentState === 'work') {
      if (currentCycle < totalCycles && restTime > 0) {
        currentState = 'rest';
        timeLeft = restTime;
        speak('休息');
      } else if (currentCycle < totalCycles && restTime === 0) {
        currentCycle++;
        currentState = 'work';
        timeLeft = workTime;
        speak('開始運動');
      } else {
        finishTimer();
        return;
      }
    } else if (currentState === 'rest') {
      currentCycle++;
      currentState = 'work';
      timeLeft = workTime;
      speak('開始運動');
    }

    updateDisplay();
  }

  function finishTimer() {
    currentState = 'completed';
    pauseTimer();
    speak('恭喜你，運動完成！');
    document.getElementById('startBtn').innerText = '再次開始';
    disableInputs(false);
    updateDisplay();
  }

  updateDisplay();
</script>

</body>
</html>
