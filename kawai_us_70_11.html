<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KAWAI US-70 (900771) 二手現場驗琴清單（11 項完整版）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        /* 自訂鋼琴紅木與象牙白主題配色 */
        :root {
            --mahogany-dark: #3B1C0E;
            --mahogany-main: #5C2C16;
            --ivory-bg: #FAF8F5;
            --brass-gold: #B8860B;
        }
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--ivory-bg);
            color: #2D241E;
            -webkit-tap-highlight-color: transparent;
            scroll-behavior: smooth;
        }
        .bg-mahogany {
            background: linear-gradient(135deg, #4A2210 0%, #2C1207 100%);
        }
        .border-brass {
            border-color: #C59B27;
        }
        .status-btn {
            transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .status-btn:active {
            transform: scale(0.96);
        }
        .hotspot-circle {
            cursor: pointer;
            transform-box: fill-box;
            transform-origin: center;
            transition: transform 0.2s ease;
        }
        .hotspot-circle:hover, .hotspot-circle:active {
            transform: scale(1.2);
        }
        .hidden-input {
            display: none;
        }
    </style>
</head>
<body class="pb-32">

    <!-- 頂部固定資訊欄與即時進度 -->
    <header class="sticky top-0 z-40 bg-mahogany text-white shadow-lg border-b-2 border-brass">

            <div class="flex items-center justify-between gap-2">
                <div>
                    <div class="flex flex-wrap items-center gap-1.5">
                        <span class="bg-amber-500/20 text-amber-300 border border-amber-400/40 text-[11px] font-bold px-2 py-0.5 rounded-full">11 項完整版</span>
                        <h1 class="text-base sm:text-lg font-black tracking-wide text-amber-50">KAWAI US-70 / 序號 900771</h1>
                    </div>
                    <p class="text-xs text-amber-200/80 mt-0.5">二手現場驗琴清單｜台日合作東和製造｜大譜架高琴身</p>
                </div>
                <button onclick="resetAllData(event)" class="text-xs bg-white/10 hover:bg-white/20 text-amber-100 px-2.5 py-1.5 rounded-lg border border-white/15 transition shrink-0">
                    重設記錄

            </div>

            <!-- 即時進度條 -->

                <div class="flex justify-between items-center text-xs mb-1.5">

                    <span class="font-medium text-amber-100">實拍照片：<strong id="photo-count-text" class="text-emerald-300 text-sm">0</strong> 張</span>

                <div class="w-full bg-stone-800 rounded-full h-2 overflow-hidden">
                    <div id="progress-bar" class="bg-gradient-to-r from-amber-500 to-emerald-400 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 pt-5 space-y-6">

                    <text x="455" y="24" font-size="12" fill="#78716C" font-weight="bold">琴背結構視角 (2)</text>

                        <rect x="281" y="187" width="5" height="9"/><rect x="290" y="187" width="5" height="9"/><rect x="299" y="187" width="5" height="9"/>
                        <rect x="317" y="187" width="5" height="9"/><rect x="326" y="187" width="5" height="9"/>
                        <rect x="344" y="187" width="5" height="9"/><rect x="353" y="187" width="5" height="9"/><rect x="362" y="187" width="5" height="9"/>

                    <!-- 下門板區域 -->

                    <rect x="70" y="218" width="310" height="108" rx="4" fill="#D97706" fill-opacity="0.18" stroke="#FBBF24" stroke-width="1.2" stroke-dasharray="5,3"/>

                        <line x1="454" y1="120" x2="588" y2="210"/>
                        <line x1="454" y1="170" x2="588" y2="260"/>
                        <line x1="454" y1="220" x2="588" y2="310"/>

                    <rect x="485" y="50" width="14" height="294" fill="#451A03"/>

                    <rect x="572" y="50" width="14" height="294" fill="#451A03"/>
                    <text x="521" y="366" font-size="11" fill="#57534E" text-anchor="middle" font-weight="bold">背面粗木頭背柱</text>

                    <!-- 1: 下門板響板 -->
                    <g class="hotspot-circle" onclick="scrollToCheck(1)" filter="url(#shadow)">

                    </g>
                    <!-- 2: 鋼琴背面背柱 -->
                    <g class="hotspot-circle" onclick="scrollToCheck(2)" filter="url(#shadow)">

                    </g>
                    <!-- 3: 弦軸板與調律釘 -->

                    </g>
                    <!-- 4: 低音粗銅弦與高音定弦鈕 -->
                    <g class="hotspot-circle" onclick="scrollToCheck(4)" filter="url(#shadow)">
                        <circle cx="338" cy="86" r="15" fill="#DC2626" stroke="#FFFFFF" stroke-width="2"/>
                        <text x="338" y="91" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">4</text>
                    </g>
                    <!-- 5: 打擊系統(打弦槌) -->

                        <text x="96" y="317" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">8</text>
                    </g>
                    <!-- 9: 弱音踏板(中)與柔音踏板(左) -->
                    <g class="hotspot-circle" onclick="scrollToCheck(9)" filter="url(#shadow)">
                        <circle cx="195" cy="356" r="15" fill="#D97706" stroke="#FFFFFF" stroke-width="2"/>
                        <text x="195" y="361" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">9</text>
                    </g>
                    <!-- 10: 同音三弦一致性與雜音 -->
                    <g class="hotspot-circle" onclick="scrollToCheck(10)" filter="url(#shadow)">
                        <circle cx="265" cy="116" r="15" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
                        <text x="265" y="121" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">10</text>
                    </g>
                    <!-- 11: 琴鍵左右搖晃與琴蓋鉸鏈 -->
                    <g class="hotspot-circle" onclick="scrollToCheck(11)" filter="url(#shadow)">
                        <circle cx="345" cy="195" r="15" fill="#059669" stroke="#FFFFFF" stroke-width="2"/>

            </div>
            <div class="flex flex-wrap gap-x-3 gap-y-1.5 mt-2.5 text-xs text-stone-600 justify-center">
                <span class="inline-flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-red-600"></span>核心結構 (1-4)</span>
                <span class="inline-flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span>擊弦與音準 (5,10)</span>
                <span class="inline-flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-amber-600"></span>踏板與鍵盤 (6,7,9)</span>
                <span class="inline-flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-purple-600"></span>蟲蛀防潮 (8)</span>

        <!-- 11 大檢查項目容器（由 JS 動態渲染） -->

        <!-- 整體總結備註區 -->

            </label>

                oninput="saveOverallNotes(this.value)"></textarea>
        </section>

    </main>

    <!-- 底部懸浮匯出操作列 -->
    <div class="fixed bottom-0 inset-x-0 z-40 bg-white/95 backdrop-blur-md border-t border-stone-200 shadow-[0_-4px_16px_rgba(0,0,0,0.08)] p-3">
        <div class="max-w-2xl mx-auto">
            <button onclick="generateReportImage()" id="export-btn"
                class="w-full py-3.5 px-5 rounded-xl bg-gradient-to-r from-[#5C2C16] via-[#7A3819] to-[#4A2210] hover:brightness-110 active:scale-[0.99] text-white font-bold text-base shadow-md flex items-center justify-center gap-2 transition border border-amber-400/40">
                <svg class="w-5 h-5 text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
                <span>生成並匯出完整驗琴報告長圖</span>
            </button>
        </div>
    </div>

    <!-- 匯出圖片預覽與下載 Modal -->
    <div id="export-modal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-5">
        <div class="bg-white rounded-2xl max-w-xl w-full max-h-[92vh] flex flex-col overflow-hidden shadow-2xl">
            <div class="px-4 py-3 bg-mahogany text-white flex items-center justify-between">
                <h3 class="font-bold text-base flex items-center gap-2">
                    <span>📋</span> 11 項完整驗琴報告圖已生成
                </h3>
                <button onclick="closeExportModal()" class="p-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white text-sm">
                    ✕ 關閉
                </button>
            </div>
            
            <div class="p-3 bg-amber-50 border-b border-amber-200 text-xs text-amber-900 flex items-start gap-2">
                <span class="text-base leading-none">💡</span>
                <div>
                    <p class="mb-1"><strong>iPhone 儲存方式（擇一）：</strong></p>
                    <p>1. 點「分享到相簿」→ 選「儲存影像」</p>

            <div class="p-3 bg-white border-t border-stone-200 flex flex-col gap-2">

                <div class="flex gap-2">

    <!-- 隱藏用繪圖 Canvas -->
    <canvas id="report-canvas" class="hidden"></canvas>

    <script>
        // 11 項完整檢查點資料與專屬局部 SVG 示意圖
        const CHECK_ITEMS = [

        // 狀態儲存物件

            CHECK_ITEMS.forEach(item => {

            try {
                const saved = localStorage.getItem('kawai_us70_900771_v2_state');

                    if (parsed.overallNotes) {
                        appState.overallNotes = parsed.overallNotes;
                        document.getElementById('overall-notes').value = parsed.overallNotes;
                    }
                    if (parsed.items) {

                                appState.items[id].note = parsed.items[id].note || '';
                            }
                        });
                    }
                }
            } catch (e) {
                console.warn('讀取暫存失敗:', e);
            }

            renderChecklist();
            updateProgress();
        }

                        status: appState.items[id].status,

        function scrollToCheck(id) {

        function setStatus(id, status) {
            appState.items[id].status = (appState.items[id].status === status) ? null : status;
            persistState();
            renderChecklist();

        }

        function setNote(id, val) {

        // 前端 Canvas 壓縮至最大邊長 800px（兼顧細節清晰與避免多圖記憶體爆掉）；每項張數不限
        function handlePhotoUpload(id, inputEl) {
            const file = inputEl.files && inputEl.files[0];
            if (!file) return;

            showToast('正在壓縮處理照片...');
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const MAX_SIZE = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height && width > MAX_SIZE) {
                        height = Math.round((height * MAX_SIZE) / width);
                        width = MAX_SIZE;
                    } else if (height >= width && height > MAX_SIZE) {
                        width = Math.round((width * MAX_SIZE) / height);
                        height = MAX_SIZE;
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.84);
                    appState.items[id].photos.push(compressedDataUrl);

                    if (!appState.items[id].status) {
                        appState.items[id].status = 'pass';
                    }

                    // 清空 input，方便同一按鈕連續再拍
                    inputEl.value = '';

                    persistState();
                    renderChecklist();
                    updateProgress();
                    showToast('照片已加入記錄！');
                };
                img.onerror = function() {
                    inputEl.value = '';
                    showToast('照片讀取失敗，請再試一次');
                };
                img.src = e.target.result;
            };
            reader.onerror = function() {
                inputEl.value = '';
                showToast('照片讀取失敗，請再試一次');
            };
            reader.readAsDataURL(file);
        }

        function removePhoto(id, photoIndex) {
            appState.items[id].photos.splice(photoIndex, 1);
            renderChecklist();
            updateProgress();
            showToast('已刪除照片');

        function updateProgress() {
            let checkedCount = 0;
            let totalPhotos = 0;
            CHECK_ITEMS.forEach(item => {
                const s = appState.items[item.id];
                if (s.status) checkedCount++;
                totalPhotos += s.photos.length;
            });

            document.getElementById('progress-text').textContent = `${checkedCount} / ${CHECK_ITEMS.length}`;
            document.getElementById('photo-count-text').textContent = totalPhotos;
            const pct = Math.round((checkedCount / CHECK_ITEMS.length) * 100);
            document.getElementById('progress-bar').style.width = `${pct}%`;
        }

        let resetConfirmTimer = null;
        function resetAllData(ev) {
            const btn = ev.target;
            if (btn.dataset.confirming !== 'true') {
                btn.dataset.confirming = 'true';
                btn.textContent = '確定清除？再點一次';
                btn.classList.add('bg-red-600', 'text-white');
                resetConfirmTimer = setTimeout(() => {
                    btn.dataset.confirming = 'false';
                    btn.textContent = '重設記錄';
                    btn.classList.remove('bg-red-600', 'text-white');
                }, 3000);
                return;
            }

            clearTimeout(resetConfirmTimer);
            btn.dataset.confirming = 'false';
            btn.textContent = '重設記錄';
            btn.classList.remove('bg-red-600', 'text-white');

            localStorage.removeItem('kawai_us70_900771_v2_state');
            appState.overallNotes = '';
            document.getElementById('overall-notes').value = '';
            CHECK_ITEMS.forEach(item => {
                appState.items[item.id] = { status: null, note: '', photos: [] };
            });
            renderChecklist();
            updateProgress();
            showToast('已重設所有檢查記錄');
        }

        function loadImageAsync(src) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = src;
            });
        }

        function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight) {
            const chars = text.split('');
            let line = '';
            let currentY = y;
            for (let i = 0; i < chars.length; i++) {
                const testLine = line + chars[i];
                const metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && i > 0) {
                    ctx.fillText(line, x, currentY);
                    line = chars[i];
                    currentY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, x, currentY);
            return currentY + lineHeight;
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        // 生成 11 項完整驗琴報告長圖 (1200px 寬)
        async function generateReportImage() {
            const btn = document.getElementById('export-btn');
            const origHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span>⏳ 正在合成 11 項完整報告長圖...</span>';

            try {
                const W = 1200;
                const PADDING = 40;
                const CARD_W = W - PADDING * 2;

                const loadedPhotosMap = {};
                let passCount = 0, warnCount = 0, failCount = 0, photoTotal = 0;

                for (const item of CHECK_ITEMS) {
                    const state = appState.items[item.id];
                    if (state.status === 'pass') passCount++;
                    else if (state.status === 'warn') warnCount++;
                    else if (state.status === 'fail') failCount++;

                    loadedPhotosMap[item.id] = [];
                    for (const src of state.photos) {
                        const img = await loadImageAsync(src);
                        if (img) {
                            loadedPhotosMap[item.id].push(img);
                            photoTotal++;
                        }
                    }
                }

                const HEADER_H = 215;
                const CARD_GAP = 22;
                const PHOTO_COLS = 2;
                const PHOTO_BOX_H = 300;
                const PHOTO_GAP = 16;
                const cardHeights = CHECK_ITEMS.map(item => {
                    const state = appState.items[item.id];
                    const photos = loadedPhotosMap[item.id];
                    let h = 108;
                    if (state.note && state.note.trim() !== '') {
                        h += 56;
                    }
                    if (photos.length > 0) {
                        const rows = Math.ceil(photos.length / PHOTO_COLS);
                        h += rows * (PHOTO_BOX_H + PHOTO_GAP) + 8;
                    }
                    return h;
                });

                const overallNoteH = (appState.overallNotes && appState.overallNotes.trim() !== '') ? 160 : 0;
                const FOOTER_H = 80;
                const totalH = HEADER_H + PADDING + cardHeights.reduce((a, b) => a + b + CARD_GAP, 0) + overallNoteH + FOOTER_H;

                const canvas = document.getElementById('report-canvas');
                canvas.width = W;
                canvas.height = totalH;
                const ctx = canvas.getContext('2d');

                // 背景
                ctx.fillStyle = '#FAF8F5';
                ctx.fillRect(0, 0, W, totalH);

                // 頂部紅木橫幅
                const grad = ctx.createLinearGradient(0, 0, W, HEADER_H);
                grad.addColorStop(0, '#4A2210');
                grad.addColorStop(1, '#260E04');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, HEADER_H);

                ctx.fillStyle = '#D4AF37';
                ctx.fillRect(0, HEADER_H - 6, W, 6);

                ctx.fillStyle = '#FEF3C7';
                ctx.font = '900 38px "Noto Sans TC", sans-serif';
                ctx.fillText('KAWAI US-70 / 序號 900771 現場驗琴報告（11 項完整版）', PADDING, 72);

                ctx.fillStyle = '#FDE68A';
                ctx.font = '500 22px "Noto Sans TC", sans-serif';
                const nowStr = new Date().toLocaleString('zh-TW', { hour12: false });
                ctx.fillText(`台日合作東和製造｜大譜架高琴身｜產出時間：${nowStr}`, PADDING, 114);

                // 進度摘要列
                ctx.font = '700 22px "Noto Sans TC", sans-serif';
                ctx.fillStyle = '#34D399';
                ctx.fillText(`✅ 正常通過：${passCount} 項`, PADDING, 170);
                ctx.fillStyle = '#FBBF24';
                ctx.fillText(`⚠️ 需留意：${warnCount} 項`, PADDING + 250, 170);
                ctx.fillStyle = '#F87171';
                ctx.fillText(`❌ 異常：${failCount} 項`, PADDING + 480, 170);
                ctx.fillStyle = '#E7E5E4';
                ctx.fillText(`📸 實拍照片：${photoTotal} 張`, PADDING + 690, 170);

                // 繪製 11 張卡片
                let curY = HEADER_H + PADDING;

                CHECK_ITEMS.forEach((item, index) => {
                    const state = appState.items[item.id];
                    const photos = loadedPhotosMap[item.id];
                    const cH = cardHeights[index];

                    ctx.save();
                    roundRect(ctx, PADDING, curY, CARD_W, cH, 16);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fill();
                    ctx.lineWidth = 2.5;
                    ctx.strokeStyle = state.status === 'pass' ? '#16A34A' :
                                      state.status === 'warn' ? '#D97706' :
                                      state.status === 'fail' ? '#DC2626' : '#D6D3D1';
                    ctx.stroke();
                    ctx.restore();

                    // 編號圓圈
                    ctx.beginPath();
                    ctx.arc(PADDING + 42, curY + 48, 22, 0, Math.PI * 2);
                    ctx.fillStyle = '#4A2210';
                    ctx.fill();
                    ctx.fillStyle = '#FDE68A';
                    ctx.font = '900 21px "Noto Sans TC", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(String(item.id), PADDING + 42, curY + 55);
                    ctx.textAlign = 'left';

                    // 項目標題
                    ctx.fillStyle = '#1C1917';
                    ctx.font = '700 24px "Noto Sans TC", sans-serif';
                    ctx.fillText(item.title, PADDING + 76, curY + 56);

                    // 右上角狀態膠囊
                    let statusLabel = '⬜ 尚未勾選';
                    let statusBg = '#F5F5F4';
                    let statusFg = '#57534E';
                    if (state.status === 'pass') {
                        statusLabel = '✅ 正常通過';
                        statusBg = '#DCFCE7';
                        statusFg = '#15803D';
                    } else if (state.status === 'warn') {
                        statusLabel = '⚠️ 需留意';
                        statusBg = '#FEF3C7';
                        statusFg = '#B45309';
                    } else if (state.status === 'fail') {
                        statusLabel = '❌ 有異常';
                        statusBg = '#FEE2E2';
                        statusFg = '#B91C1C';
                    }

                    const badgeW = 185;
                    const badgeH = 42;
                    const badgeX = PADDING + CARD_W - badgeW - 22;
                    const badgeY = curY + 26;
                    roundRect(ctx, badgeX, badgeY, badgeW, badgeH, 21);
                    ctx.fillStyle = statusBg;
                    ctx.fill();
                    ctx.fillStyle = statusFg;
                    ctx.font = '700 21px "Noto Sans TC", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(statusLabel, badgeX + badgeW / 2, badgeY + 29);
                    ctx.textAlign = 'left';

                    let innerY = curY + 92;

                    if (state.note && state.note.trim() !== '') {
                        roundRect(ctx, PADDING + 24, innerY, CARD_W - 48, 42, 10);
                        ctx.fillStyle = '#F5F5F4';
                        ctx.fill();
                        ctx.fillStyle = '#292524';
                        ctx.font = '500 20px "Noto Sans TC", sans-serif';
                        ctx.fillText(`📝 現場備註：${state.note.trim()}`, PADDING + 38, innerY + 28);
                        innerY += 56;
                    }

                    if (photos.length > 0) {
                        const photoBoxW = photos.length === 1
                            ? Math.min(560, CARD_W - 48)
                            : (CARD_W - 48 - PHOTO_GAP) / PHOTO_COLS;
                        const photoBoxH = PHOTO_BOX_H;

                        photos.forEach((img, pIdx) => {
                            const col = pIdx % PHOTO_COLS;
                            const row = Math.floor(pIdx / PHOTO_COLS);
                            const px = PADDING + 24 + col * (photoBoxW + PHOTO_GAP);
                            const py = innerY + row * (photoBoxH + PHOTO_GAP);

                            roundRect(ctx, px, py, photoBoxW, photoBoxH, 12);
                            ctx.fillStyle = '#1C1917';
                            ctx.fill();

                            const scale = Math.min(photoBoxW / img.width, photoBoxH / img.height);
                            const drawW = img.width * scale;
                            const drawH = img.height * scale;
                            const drawX = px + (photoBoxW - drawW) / 2;
                            const drawY = py + (photoBoxH - drawH) / 2;

                            ctx.drawImage(img, drawX, drawY, drawW, drawH);

                            ctx.fillStyle = 'rgba(0,0,0,0.68)';
                            ctx.fillRect(px + 10, py + 10, 102, 30);
                            ctx.fillStyle = '#FFFFFF';
                            ctx.font = '700 16px "Noto Sans TC", sans-serif';
                            ctx.fillText(`實拍 #${item.id}-${pIdx + 1}`, px + 18, py + 31);
                        });
                    }

                    curY += cH + CARD_GAP;
                });

                // 整體補充備註
                if (overallNoteH > 0) {
                    roundRect(ctx, PADDING, curY, CARD_W, overallNoteH - 20, 16);
                    ctx.fillStyle = '#FEF3C7';
                    ctx.fill();
                    ctx.strokeStyle = '#F59E0B';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    ctx.fillStyle = '#78350F';
                    ctx.font = '700 24px "Noto Sans TC", sans-serif';
                    ctx.fillText('📋 買家整體補充備註：', PADDING + 28, curY + 42);

                    ctx.fillStyle = '#292524';
                    ctx.font = '500 21px "Noto Sans TC", sans-serif';
                    drawWrappedText(ctx, appState.overallNotes.trim(), PADDING + 28, curY + 80, CARD_W - 56, 30);
                    curY += overallNoteH;
                }

                // 頁尾
                ctx.fillStyle = '#78716C';
                ctx.font = '500 20px "Noto Sans TC", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('KAWAI US-70 (900771) 11 項完整驗琴報告｜請將此圖傳送給 AI 進行最終琴況評估', W / 2, curY + 35);
                ctx.textAlign = 'left';

                const finalDataUrl = canvas.toDataURL('image/jpeg', 0.88);

                // 轉成 Blob，方便 iPhone 下載／分享（data URL 在 Safari 較不穩定）
                const blob = dataURLtoBlob(finalDataUrl);
                if (window._reportBlobUrl) {
                    try { URL.revokeObjectURL(window._reportBlobUrl); } catch (e) {}
                }
                window._reportBlobUrl = URL.createObjectURL(blob);
                window._reportBlob = blob;
                window._reportDataUrl = finalDataUrl;

                document.getElementById('generated-report-img').src = window._reportBlobUrl;
                const dl = document.getElementById('download-report-link');
                dl.href = window._reportBlobUrl;
                dl.download = 'KAWAI_US70_900771_11項驗琴報告.jpg';

                document.getElementById('export-modal').classList.remove('hidden');

            } catch (err) {
                console.error('匯出失敗:', err);
                showToast('生成圖片時發生錯誤，請減少照片數量後重試');
            } finally {
                btn.disabled = false;
                btn.innerHTML = origHtml;
            }
        }

        function dataURLtoBlob(dataUrl) {
            const parts = dataUrl.split(',');
            const mime = (parts[0].match(/:(.*?);/) || [])[1] || 'image/jpeg';
            const binary = atob(parts[1]);
            const len = binary.length;
            const u8 = new Uint8Array(len);
            for (let i = 0; i < len; i++) u8[i] = binary.charCodeAt(i);
            return new Blob([u8], { type: mime });
        }

        async function shareReportImage() {
            const blob = window._reportBlob;
            if (!blob) {
                showToast('請先生成報告圖');
                return;
            }
            const file = new File([blob], 'KAWAI_US70_900771_11項驗琴報告.jpg', { type: 'image/jpeg' });

            // iOS / 支援 Web Share 的瀏覽器：可直接分享並選「儲存影像」
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        files: [file],
                        title: 'KAWAI US-70 驗琴報告',
                        text: 'KAWAI US-70 (900771) 11 項完整驗琴報告'
                    });
                    showToast('已開啟分享選單');
                    return;
                } catch (err) {
                    if (err && err.name === 'AbortError') return;
                    console.warn('share failed', err);
                }
            }

            // 備援：開啟圖片新分頁，方便長按儲存
            if (window._reportBlobUrl) {
                const w = window.open(window._reportBlobUrl, '_blank');
                if (w) {
                    showToast('已開啟圖片，請長按圖片選「儲存影像」');
                } else {
                    showToast('請長按下方預覽圖選「儲存影像」');
                }
            } else {
                showToast('請長按下方預覽圖選「儲存影像」');
            }
        }

        function closeExportModal() {
            document.getElementById('export-modal').classList.add('hidden');
        }

        function showToast(msg) {
            const el = document.getElementById('toast-msg');
            el.textContent = msg;
            el.classList.remove('hidden');
            clearTimeout(el._timer);
            el._timer = setTimeout(() => {
                el.classList.add('hidden');
            }, 2200);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        window.onload = initApp;
    </script>
</body>
